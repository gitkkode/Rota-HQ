<section class="auth-card">
  <div class="auth-card-head">
    <h2>Reset password</h2>
    <p>Enter your email and we’ll send mock reset instructions.</p>
  </div>

  @if (sent()) {
    <div class="auth-success" role="status">
      Check your inbox for reset instructions. This is a mock flow — no email is actually sent.
    </div>
    <p class="auth-foot">
      <a class="auth-link" routerLink="/auth/login">Back to sign in</a>
    </p>
  } @else {
    <form class="auth-form" (submit)="submit($event)" novalidate>
      @if (error()) {
        <div class="auth-error" role="alert">{{ error() }}</div>
      }

      <label>
        Email address
        <input
          type="email"
          autocomplete="email"
          placeholder="you@company.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </label>

      <button class="hq-btn hq-btn-primary auth-submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>

    <p class="auth-foot">
      Remember your password?
      <a class="auth-link" routerLink="/auth/login">Sign in</a>
    </p>
  }
</section>
